[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ll3m"
version = "0.1.0"
description = "Large Language 3D Modelers - Multi-agent system for generating 3D assets"
authors = [{name = "LL3M Team"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "langgraph>=0.0.40",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "aiohttp>=3.8.0",
    "aiofiles>=22.0.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "click>=8.0.0",
    "structlog>=22.0.0",
    "rich>=13.0.0",
    # API dependencies
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",  # PostgreSQL async driver
    "aiosqlite>=0.19.0",  # SQLite async driver for development
    "slowapi>=0.1.9",  # Rate limiting
    "python-jose[cryptography]>=3.3.0",  # JWT tokens
    "passlib[bcrypt]>=1.7.4",  # Password hashing
    "python-multipart>=0.0.6",  # Form data support
    "psutil>=5.9.0",  # System and process monitoring
    "numpy>=1.24.0",  # Numerical computations for embeddings
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.10.0",
    "pytest-cov>=4.0.0",
    "pytest-benchmark>=4.0.0",  # For benchmark tests
    "pytest-xdist>=3.0.0",  # For parallel test execution
    "httpx>=0.25.0",  # Required for FastAPI TestClient
    "ruff>=0.5.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
    "pyupgrade>=3.19.0",
    "bandit[toml]>=1.7.0",  # Security scanning
    "pbr>=6.0.0",  # Required by bandit
    # Type stubs for better type checking
    "types-PyYAML>=6.0.0",
    "types-passlib>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[project.scripts]
ll3m = "cli:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "C90", # mccabe complexity
    "N",   # pep8-naming
    "D",   # pydocstyle
    "S",   # flake8-bandit (security)
    "T20", # flake8-print (catch print statements)
    "RET", # flake8-return (improve return statements)
    "SIM", # flake8-simplify (code simplification)
    "TRY", # tryceratops (exception handling)
    "PLR", # pylint refactor (code quality)
]
ignore = [
    # Docstring rules - only disable for public APIs where docs exist elsewhere
    "D100", "D104",  # Missing docstring in public module/package (often handled by README)
    "D211", "D213",  # Docstring formatting preferences

    # Security rules that conflict with development/testing needs
    "S101",  # Use of assert (needed for tests)
    "S603",  # subprocess without shell=True verification (needed for Blender execution)

    # Print statements - allow in CLI and debug contexts
    "T201",  # Print statements (needed for CLI output and debugging)

    # Complexity - AI agents and workflows can be inherently complex
    "PLR0913",  # Too many arguments (AI agent methods need multiple parameters)
    "PLR0915",  # Too many statements (workflow methods can be lengthy)
    "C901",     # Complex functions (up to max-complexity = 10)

    # Exception handling - AI systems have complex error patterns
    "TRY003",   # Avoid specifying long messages outside exception class

    # Return statements - AI workflows have complex return patterns
    "RET504", "RET505", "RET506",  # Unnecessary assignment before return

    # Style preferences that conflict with formatter
    "COM812", "ISC001",  # Trailing comma and string concatenation (ruff format handles this)
]

[tool.ruff.lint.per-file-ignores]
# Test files: Relax documentation and some security rules for testing
"tests/**/*" = ["D", "S101", "S105", "S106", "S108", "ARG001", "PLR2004"]  # Tests don't need docs, can use assert/hardcoded values
"test_*.py" = ["D", "S101", "S105", "S106", "S108", "ARG001", "PLR2004"]

# Setup and utility scripts
"setup/*" = ["S102", "S603", "E402", "T201"]  # Setup can use subprocess, imports, prints
"verify_setup.py" = ["S603", "T201", "PLR0912"]  # Verification script can be complex
"src/cli.py" = ["T201", "PLR0912"]  # CLI can print and have complexity

# Generated/external files
"stubs/*" = ["N802", "F401", "F403"]  # Type stubs have different conventions
"renders/**/*" = ["D", "F401", "F403", "F405"]  # Generated render files

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
# Enable strict mode with selective overrides
strict = true
# Additional strictness beyond standard strict mode
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
# Maximum strictness settings - push the boundaries
disallow_any_expr = false  # Still too strict for external libs
disallow_any_decorated = true   # ENHANCED: Now require typed decorators
disallow_any_explicit = false  # Allow explicit Any but warn about it
disallow_any_generics = true   # Require type parameters for generics
disallow_subclassing_any = true  # Prevent subclassing Any
disallow_any_unimported = true  # NEW: Disallow Any from unimported modules
# Advanced strictness features
local_partial_types = true  # Require complete types for local variables
disallow_untyped_decorators = true  # Require typed decorators
disallow_incomplete_defs = true  # NEW: All function definitions must be typed
disallow_untyped_defs = true  # NEW: All functions must be typed
# Enable all extra checks
extra_checks = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
mypy_path = "stubs"
# Additional warnings - maximize detection
warn_incomplete_stub = true
no_implicit_reexport = true
no_implicit_optional = true  # NEW: Require explicit Optional[T] instead of T | None = None
strict_optional = true  # NEW: Enhanced Optional handling
strict_equality = true  # NEW: Strict equality comparisons
strict_concatenate = true  # NEW: Strict Concatenate usage
# Check untyped definitions more strictly
check_untyped_defs = true  # Check bodies of untyped functions
# Minimize disabled error codes - maximum detection
disable_error_code = []

# Remove this duplicate override - already exists below

# Highest quality modules - enable full strict checking
[[tool.mypy.overrides]]
module = "src.utils.types"
strict = true

# High-quality modules - enable full strict checking
[[tool.mypy.overrides]]
module = "src.services.performance_monitor"
strict = true

[[tool.mypy.overrides]]
module = "src.utils.monitoring"
strict = true

[[tool.mypy.overrides]]
module = "src.blender.enhanced_executor"
strict = true

# API routes - FastAPI integration needs specific ignores
[[tool.mypy.overrides]]
module = "src.api.routes.*"
disable_error_code = ["arg-type", "no-untyped-def", "misc", "no-any-unimported", "import-not-found", "import-untyped"]  # SQLAlchemy Column + FastAPI route functions
disallow_any_explicit = false  # API responses may need Any

[[tool.mypy.overrides]]
module = "src.api.app"
disallow_any_explicit = false  # FastAPI setup may need Any
disable_error_code = ["no-any-unimported", "misc", "import-not-found", "assignment"]  # FastAPI integration

# Database - SQLAlchemy has complex ORM patterns and version compatibility issues
[[tool.mypy.overrides]]
module = "src.api.database"
disable_error_code = ["assignment", "attr-defined", "valid-type", "misc", "no-untyped-call", "no-any-unimported", "type-arg", "no-untyped-def", "import-not-found"]  # SQLAlchemy compatibility

# Auth module - third-party library integration
[[tool.mypy.overrides]]
module = "src.api.auth"
disable_error_code = ["no-untyped-call", "import-untyped", "no-any-unimported", "misc"]  # Jose/Passlib integration

# Config module - Pydantic BaseSettings integration
[[tool.mypy.overrides]]
module = "src.utils.config"
disable_error_code = ["misc", "no-any-unimported", "no-any-return", "no-untyped-def", "call-overload"]  # Pydantic BaseSettings integration

# Dependencies module - FastAPI dependency injection
[[tool.mypy.overrides]]
module = "src.api.dependencies"
disable_error_code = ["no-untyped-call", "no-any-unimported"]  # FastAPI dependency injection

# New refactored modules - allow some flexibility during transition
[[tool.mypy.overrides]]
module = "src.workflow.state_models"
disable_error_code = ["arg-type"]  # Pydantic Field configurations

[[tool.mypy.overrides]]
module = "src.blender.enhanced_executor"
disable_error_code = ["arg-type", "attr-defined"]  # Blender integration patterns

[[tool.mypy.overrides]]
module = "src.blender.export_manager"
disable_error_code = ["unreachable"]  # Export format validation

[[tool.mypy.overrides]]
module = "src.utils.blender_code_utils"
disable_error_code = ["assignment"]  # Dynamic code generation

[[tool.mypy.overrides]]
module = "src.services.analytics"
disable_error_code = ["dict-item"]  # Analytics data structures

[[tool.mypy.overrides]]
module = "src.services.performance_monitor"
disable_error_code = ["dict-item"]  # Performance monitoring structures

[[tool.mypy.overrides]]
module = "src.utils.monitoring"
disable_error_code = ["misc"]  # Monitoring decorators


# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_any_decorated = false

[[tool.mypy.overrides]]
module = "bpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiohttp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "langgraph.*"
ignore_missing_imports = true

# Blender-related modules - make stricter, only keep essential overrides
[[tool.mypy.overrides]]
module = "src.blender.*"
# Remove disallow_any_unimported override - let it be strict

# CLI module - only keep essential overrides
[[tool.mypy.overrides]]
module = "src.cli"
disable_error_code = ["import-untyped"]  # Only keep import pattern override


# LLM client has complex async generator patterns
[[tool.mypy.overrides]]
module = "src.utils.llm_client"
disallow_untyped_defs = false
disallow_untyped_calls = false
disable_error_code = ["misc", "no-any-return"]

# Agent modules - make stricter, only keep essential OpenAI compatibility
[[tool.mypy.overrides]]
module = "src.agents.*"
disable_error_code = ["no-any-return"]  # Only keep OpenAI response compatibility

# Workflow modules - LangGraph integration
[[tool.mypy.overrides]]
module = "src.workflow.*"
disallow_any_explicit = false  # LangGraph state can be Any
disable_error_code = ["return-value"]  # LangGraph return types complex

# FastAPI and web framework modules - external libs without complete stubs
[[tool.mypy.overrides]]
module = ["fastapi.*", "pydantic_settings.*", "structlog.*", "slowapi.*"]
ignore_missing_imports = true
disable_error_code = ["import-not-found", "no-any-unimported", "misc", "no-untyped-call"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-report=xml",
    "--cov-fail-under=80",  # Align with GOOD_PRACTICES.md
    "--durations=10",
    "-ra",
]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "blender: marks tests that require Blender",
    "benchmark: marks tests as performance benchmarks",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
env = [
    "ENVIRONMENT=test",
    "OPENAI_API_KEY=sk-test-mock-key-for-testing",
    "BLENDER_PATH=/usr/bin/blender",
]
